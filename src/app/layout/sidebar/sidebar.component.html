<aside class="sidebar">
  <div class="brand">
    <div class="brand-core">
      <span></span>
    </div>

    <div class="brand-text">
      <strong>NOTIFICATOR</strong>
      <small>COMMAND SYSTEM</small>
    </div>
  </div>

  <nav class="nav">
    <span class="nav-label">COMMAND</span>

    <a routerLink="/dashboard" routerLinkActive="active">
      <span class="nav-icon">◉</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/inbox" routerLinkActive="active">
      <span class="nav-icon">▤</span>
      <span>Unified Inbox</span>
      @if (unreadCount() > 0) {
        <span class="badge">
          {{ unreadCount() > 99 ? '99+' : unreadCount() }}
        </span>
      }
    </a>

    <a routerLink="/accounts" routerLinkActive="active">
      <span class="nav-icon">◎</span>
      <span>Accounts</span>
    </a>

    <span class="nav-label secondary">SYSTEM</span>

    <a routerLink="/settings" routerLinkActive="active">
      <span class="nav-icon">⌬</span>
      <span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-console">
    <app-system-console></app-system-console>
  </div>

  <div class="system-status">
    <span class="status-dot"></span>

    <div>
      <strong>System Online</strong>
      <small>All services active</small>
    </div>
  </div>
</aside>
