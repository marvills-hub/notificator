<div class="widget">
  <button
    class="floating-core"
    type="button"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (click)="toggle()"
    aria-label="Open Notificator"
  >
    <span class="hud-ring hud-ring-outer"></span>
    <span class="hud-ring hud-ring-mid"></span>
    <span class="hud-ring hud-ring-inner"></span>

    <span class="arc arc-top"></span>
    <span class="arc arc-bottom"></span>

    <span class="scan-dot"></span>

    <span class="core-glow"></span>

    <strong>
      {{ unreadCount() > 99 ? '99+' : unreadCount() }}
    </strong>

    <span class="status-dot" [class.active]="unreadCount() > 0"></span>
  </button>
</div>
